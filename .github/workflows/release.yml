name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.2"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            bundle: msi
            asset_name: unofficial-messenger-next-windows.msi
            artifact_name: windows-installer
          - name: macOS
            platform: macos-latest
            bundle: dmg
            asset_name: unofficial-messenger-next-macos.dmg
            artifact_name: macos-installer
          - name: Linux
            platform: ubuntu-22.04
            bundle: deb,appimage
            asset_name: unofficial-messenger-next-linux.deb
            artifact_name: linux-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build production app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles ${{ matrix.bundle }}

      - name: Collect Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows MSI installer was not found."
          }
          Copy-Item $installer.FullName "release-assets/${{ matrix.asset_name }}"
          $signature = Get-Item "$($installer.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $signature) {
            throw "Windows updater signature was not found."
          }
          Copy-Item $signature.FullName "release-assets/${{ matrix.asset_name }}.sig"

      - name: Collect macOS installer
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p release-assets
          installer="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -type f | head -n 1)"
          if [ -z "$installer" ]; then
            echo "macOS DMG installer was not found." >&2
            exit 1
          fi
          cp "$installer" "release-assets/${{ matrix.asset_name }}"
          updater="$(find src-tauri/target/release/bundle/macos -name '*.app.tar.gz' -type f | head -n 1)"
          if [ -z "$updater" ] || [ ! -f "$updater.sig" ]; then
            echo "macOS updater artifact or signature was not found." >&2
            exit 1
          fi
          cp "$updater" "release-assets/unofficial-messenger-next-macos-aarch64.app.tar.gz"
          cp "$updater.sig" "release-assets/unofficial-messenger-next-macos-aarch64.app.tar.gz.sig"

      - name: Collect Linux installer
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p release-assets
          installer="$(find src-tauri/target/release/bundle/deb -name '*.deb' -type f | head -n 1)"
          if [ -z "$installer" ]; then
            echo "Linux DEB installer was not found." >&2
            exit 1
          fi
          cp "$installer" "release-assets/${{ matrix.asset_name }}"
          if [ ! -f "$installer.sig" ]; then
            echo "Linux Debian updater signature was not found." >&2
            exit 1
          fi
          cp "$installer.sig" "release-assets/${{ matrix.asset_name }}.sig"
          updater="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f | head -n 1)"
          if [ -z "$updater" ] || [ ! -f "$updater.sig" ]; then
            echo "Linux updater artifact or signature was not found." >&2
            exit 1
          fi
          cp "$updater" "release-assets/unofficial-messenger-next-linux-x86_64.AppImage"
          cp "$updater.sig" "release-assets/unofficial-messenger-next-linux-x86_64.AppImage.sig"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create updater manifest
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          windows_signature="$(cat release-assets/unofficial-messenger-next-windows.msi.sig)"
          macos_signature="$(cat release-assets/unofficial-messenger-next-macos-aarch64.app.tar.gz.sig)"
          deb_signature="$(cat release-assets/unofficial-messenger-next-linux.deb.sig)"
          linux_signature="$(cat release-assets/unofficial-messenger-next-linux-x86_64.AppImage.sig)"

          jq -n \
            --arg version "$version" \
            --arg notes "Update unofficial-messenger-next to ${RELEASE_TAG}." \
            --arg pub_date "$published_at" \
            --arg windows_signature "$windows_signature" \
            --arg windows_url "$release_url/unofficial-messenger-next-windows.msi" \
            --arg macos_signature "$macos_signature" \
            --arg macos_url "$release_url/unofficial-messenger-next-macos-aarch64.app.tar.gz" \
            --arg deb_signature "$deb_signature" \
            --arg deb_url "$release_url/unofficial-messenger-next-linux.deb" \
            --arg linux_signature "$linux_signature" \
            --arg linux_url "$release_url/unofficial-messenger-next-linux-x86_64.AppImage" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64-msi": { signature: $windows_signature, url: $windows_url },
                "windows-x86_64": { signature: $windows_signature, url: $windows_url },
                "darwin-aarch64-app": { signature: $macos_signature, url: $macos_url },
                "darwin-aarch64": { signature: $macos_signature, url: $macos_url },
                "linux-x86_64-deb": { signature: $deb_signature, url: $deb_url },
                "linux-x86_64-appimage": { signature: $linux_signature, url: $linux_url },
                "linux-x86_64": { signature: $linux_signature, url: $linux_url }
              }
            }' > release-assets/latest.json

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: unofficial-messenger-next ${{ env.RELEASE_TAG }}
          body: Download the installer for your operating system from the assets below.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/*
